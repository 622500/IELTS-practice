<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>IELTS Atlas · 登录</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 600px at 20% 0%, #1b2540 0%, #0b0f1a 55%, #06080d 100%);
    color: #e8edf7;
  }
  .card {
    width: 100%; max-width: 380px; padding: 28px 24px 22px; border-radius: 18px;
    background: rgba(20, 26, 42, .82); border: 1px solid rgba(120, 150, 220, .18);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55); backdrop-filter: blur(12px);
  }
  h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .3px; }
  .sub { margin: 0 0 20px; font-size: 12px; color: #8b9ac0; }
  label { display: block; margin-bottom: 14px; font-size: 12px; color: #9fb0d4; }
  input {
    display: block; width: 100%; margin-top: 6px; padding: 11px 12px; font-size: 15px;
    color: #e8edf7; background: rgba(8, 12, 22, .9);
    border: 1px solid rgba(120, 150, 220, .28); border-radius: 10px; outline: none;
  }
  input:focus { border-color: #5b8cff; box-shadow: 0 0 0 3px rgba(91, 140, 255, .18); }
  .row { display: flex; gap: 10px; margin-top: 6px; }
  button {
    flex: 1; padding: 11px 14px; font-size: 14px; font-weight: 600; border-radius: 10px;
    cursor: pointer; border: 1px solid transparent; transition: filter .15s, opacity .15s;
  }
  button:disabled { opacity: .55; cursor: progress; }
  .primary { background: linear-gradient(180deg, #4f7dff, #3560e0); color: #fff; }
  .primary:hover:not(:disabled) { filter: brightness(1.08); }
  .ghost { background: transparent; color: #9fb0d4; border-color: rgba(120, 150, 220, .3); }
  .ghost:hover:not(:disabled) { color: #d5e0f7; border-color: rgba(120, 150, 220, .55); }
  #msg { min-height: 18px; margin: 14px 0 0; font-size: 12.5px; line-height: 1.5; color: #ff9b9b; }
  #msg.ok { color: #7ee0a8; }
  .hint { margin: 12px 0 0; font-size: 11.5px; line-height: 1.6; color: #6f7f9f; }
</style>
</head>
<body>
<main class="card">
  <h1>IELTS Atlas</h1>
  <p class="sub">个人自用实例 · 仅限单账号</p>
  <form id="f" autocomplete="on" novalidate>
    <label>账号
      <input id="u" name="username" type="text" autocomplete="username"
             maxlength="80" required spellcheck="false" autocapitalize="none" />
    </label>
    <label>密码
      <input id="p" name="password" type="password" autocomplete="current-password"
             maxlength="128" required />
    </label>
    <div class="row">
      <button type="submit" class="primary" id="btnLogin">登录</button>
      <button type="button" class="ghost" id="btnReg">首次注册</button>
    </div>
  </form>
  <p id="msg" role="alert"></p>
  <p class="hint">密码需 ≥8 位，且同时包含大写字母、小写字母和数字。<br />注册成功后本实例将永久锁定为单账号。</p>
</main>
<script>
(function () {
  var msg = document.getElementById('msg');
  var btnLogin = document.getElementById('btnLogin');
  var btnReg = document.getElementById('btnReg');
  var csrf = '';

  function setMsg(text, ok) {
    msg.textContent = text || '';
    msg.className = ok ? 'ok' : '';
  }

  function setBusy(busy) {
    btnLogin.disabled = busy;
    btnReg.disabled = busy;
  }

  function loadCsrf() {
    return fetch('/api/auth/csrf', { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) { csrf = j && j.csrfToken ? j.csrfToken : ''; })
      .catch(function () { setMsg('连接服务器失败，请刷新重试'); });
  }

  function submit(path) {
    var username = document.getElementById('u').value.trim();
    var password = document.getElementById('p').value;
    if (!username || !password) { setMsg('请填写账号和密码'); return; }
    setBusy(true);
    setMsg('处理中…', true);
    fetch(path, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'content-type': 'application/json', 'x-csrf-token': csrf },
      body: JSON.stringify({ username: username, password: password })
    })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          return { status: r.status, ok: r.ok, body: j };
        });
      })
      .then(function (res) {
        if (res.ok) {
          setMsg('成功，正在进入…', true);
          location.replace('/');
          return;
        }
        var text = (res.body && res.body.error) || ('失败（HTTP ' + res.status + '）');
        if (res.body && res.body.details && res.body.details.length) {
          text += '：' + res.body.details.join('；');
        }
        if (res.status === 403 && /limited to the first user/i.test(text)) {
          text = '本实例已存在账号，注册通道已关闭，请直接登录。';
        }
        if (res.status === 403 && /disabled/i.test(text)) {
          text = '注册通道已关闭，请直接登录。';
        }
        setMsg(text);
        setBusy(false);
        loadCsrf();
      })
      .catch(function () {
        setMsg('网络错误，请重试');
        setBusy(false);
      });
  }

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    submit('/api/auth/login');
  });
  btnReg.addEventListener('click', function () { submit('/api/auth/register'); });

  loadCsrf();
})();
</script>
</body>
</html>
